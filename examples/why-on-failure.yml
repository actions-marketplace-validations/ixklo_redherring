# Explain every failed CI run in the job summary and on the pull request.
name: redherring
on:
  workflow_run:
    workflows: [CI]             # the name of your test workflow
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write          # only for comment: true
jobs:
  why:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: ixklo/redherring@v0.2.0
        with:
          comment: true
