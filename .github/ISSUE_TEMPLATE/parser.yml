name: Failure not recognised
description: redherring said "unknown", or didn't name the failing tests in your CI log.
labels: [parser]
body:
  - type: markdown
    attributes:
      value: |
        `redherring report <job-url>` fills this in for you from the job's log, with likely secrets replaced. Worth sending when the log shows a flaky test or an infrastructure problem (network, registry, runner…) that redherring missed; a genuine build or lint error is rightly left unknown.
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The lines of the failed job's log around the failure. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What redherring said
      render: text
  - type: input
    id: runner
    attributes:
      label: Test runner or tool, if you know it
      placeholder: e.g. pytest 8.3 with pytest-xdist, Jest 30, a Docker build
  - type: input
    id: url
    attributes:
      label: Job URL (optional, public repos)
  - type: checkboxes
    id: checked
    attributes:
      label: Before you submit
      options:
        - label: I read the excerpt, and it contains nothing private (tokens, internal hostnames, customer data).
          required: true
