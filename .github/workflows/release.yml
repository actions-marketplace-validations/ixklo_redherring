# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed.
# One-time setup on pypi.org: add a "trusted publisher" for this repo, workflow release.yml,
# environment "pypi". No tokens or secrets are stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv sync && uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
